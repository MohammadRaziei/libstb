name: cmake stuff

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install python deps
      run: pip install -r requirements-dev.txt

    - name: Configure Project
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTB_BUILD_TESTS=ON -DSTB_BUILD_PYTHON=ON

    - name: Build
      run: cmake --build build -j4 --config Release

    # C++ tests, Python tests (pytest against the freshly built package) and
    # the find_package consumer test all run under ctest.
    - name: Run tests
      run: ctest --test-dir build -C Release --output-on-failure


  # The documentation site (docs/site, docs/adr/0004): examples run and match their pages, type check, static build. The build is
  # uploaded as `cmake-documentation` and deployed with the coverage dashboard by the orchestrator (deploy-pages), so there is no
  # separate Pages workflow here: two workflows deploying to one Pages site would overwrite each other.
  build-docs:
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: docs/site/package-lock.json

    - name: Every example has both languages and a README
      run: python3 scripts/prepare.py all

    - name: Build and install libstb
      working-directory: .
      run: pip install . pytest

    - name: Examples build, run and write what their pages show
      working-directory: .
      run: python -m pytest tests/python/test_examples.py -q

    # Docusaurus does not discover the address it is served from (built without it, the page says "baseUrl = /" and loads
    # no scripts), so it is derived from the repository here instead of being written down: https://<owner>.github.io + /<repo>/.
    - name: Work out the Pages address
      working-directory: .
      run: |
        echo "DOCS_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io" >> "$GITHUB_ENV"
        echo "DOCS_BASE_URL=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

    - name: Install
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cmake-documentation
        path: docs/site/build
        retention-days: 5

  build-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install python dependencies
      run: pip install -r requirements-dev.txt

    # torch is not a test dependency: tests/python/test_torch.py skips itself without it. The CPU
    # wheel (a few hundred MB, instead of several GB of CUDA libraries) makes the DLPack tests run
    # here, so they count towards the coverage report.
    - name: Install torch (CPU)
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install coverage tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DSTB_BUILD_TESTS=ON \
          -DSTB_BUILD_PYTHON=ON

    # C++ (lcov), Python (coverage.py) and the merged total.
    - name: Generate coverage report
      run: cmake --build build --target stb_coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: build/coverage/total/coverage.lcov
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cmake-coverage-report
        path: build/coverage/
        retention-days: 5
