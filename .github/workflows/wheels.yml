name: python build wheels

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]

env:
  FORCE_COLOR: 3

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-sdist
        path: dist/*.tar.gz
        overwrite: true

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.4.1
      env:
        # C++17 runtime on macOS.
        MACOSX_DEPLOYMENT_TARGET: "10.15"
        CIBW_ARCHS_MACOS: universal2
        # 3.9-3.11: normal per-version wheels (nanobind has no stable-ABI
        # support below 3.12; it silently builds a regular extension there).
        # 3.12: built once, tagged cp312-abi3 via SKBUILD_WHEEL_PY_API, and
        # that single wheel covers every newer interpreter too - so 3.13+
        # is skipped here to avoid building a redundant duplicate wheel.
        CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
        CIBW_ENVIRONMENT_CP312: "SKBUILD_WHEEL_PY_API=cp312"
        CIBW_SKIP: pp*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-${{ matrix.os }}
        path: wheelhouse/*.whl
        overwrite: false

  # The Linux wheel carries AVX2 kernels next to the portable ones and picks one at run
  # time from the CPU it finds (backends: avx2, sse2, scalar; see libstb.simd_backends()). The
  # runners that build and test the wheels all have AVX2,
  # so this job runs the very same wheel on emulated CPUs (QEMU user mode): one without AVX
  # (Nehalem: SSE4.2 only), where it must fall back to the portable kernels and pass every
  # test, and one with AVX2 (Haswell), where it must pick the AVX2 ones.
  test_cpu_features:
    name: Wheel on emulated CPUs (without / with AVX2)
    needs: build_wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - uses: actions/download-artifact@v8
      with:
        name: wheelhouse-ubuntu-latest
        path: wheelhouse

    - name: Install QEMU user-mode emulation
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user

    - name: Install the manylinux wheel (3.12, abi3) with its test dependencies
      run: |
        wheels=(wheelhouse/libstb-*-cp312-abi3-manylinux*x86_64*.whl)
        [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "expected exactly one manylinux cp312-abi3 wheel, found: ${wheels[*]}"; exit 1; }
        python -m venv venv
        venv/bin/pip install "${wheels[0]}[test]"

    - name: No AVX (Nehalem) - only the portable backends may be offered
      run: |
        qemu-x86_64 -cpu Nehalem venv/bin/python - <<'PY'
        import libstb
        print("simd_backends:", libstb.simd_backends(), "| in use:", libstb.simd_name())
        assert libstb.simd_backends() == ["sse2", "scalar"], libstb.simd_backends()
        assert libstb.simd_name() == "sse2", libstb.simd_name()
        PY

    - name: No AVX (Nehalem) - the whole test suite (covers the sse2 and scalar backends)
      working-directory: ${{ runner.temp }}
      run: qemu-x86_64 -cpu Nehalem ${{ github.workspace }}/venv/bin/python -m pytest ${{ github.workspace }}/tests/python -q -p no:cacheprovider

    - name: AVX2 (Haswell) - avx2 must be offered and picked, and equal the other backends
      working-directory: ${{ runner.temp }}
      run: |
        qemu-x86_64 -cpu Haswell ${{ github.workspace }}/venv/bin/python - <<'PY' 2>&1 | grep -v "TCG doesn't support"
        import libstb
        print("simd_backends:", libstb.simd_backends(), "| in use:", libstb.simd_name())
        assert libstb.simd_backends() == ["avx2", "sse2", "scalar"], libstb.simd_backends()
        assert libstb.simd_name() == "avx2", libstb.simd_name()
        PY
        qemu-x86_64 -cpu Haswell ${{ github.workspace }}/venv/bin/python -m pytest ${{ github.workspace }}/tests/python/test_simd.py -q -p no:cacheprovider 2>&1 | grep -v "TCG doesn't support"
        exit "${PIPESTATUS[0]}"
