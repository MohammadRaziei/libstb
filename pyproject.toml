[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "libstb"
dynamic = ["version"]
description = "Python bindings for the stb single-header libraries (image io, resize, fonts). Zero system dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
pillow = ["pillow"]
test = ["pytest", "numpy; sys_platform != 'win32' or platform_machine != 'ARM64' or python_version >= '3.11'", "pillow", "pytest-memray; sys_platform != 'win32' and (platform_machine == 'x86_64' or platform_machine == 'arm64')"]

[project.urls]
Homepage = "https://github.com/MohammadRaziei/libstb"
"Bug Tracker" = "https://github.com/MohammadRaziei/libstb/issues"

[tool.scikit-build]
build.verbose = true
cmake.build-type = "Release"
cmake.define.LIBSTB_BUILD_PYTHON = "ON"
cmake.define.LIBSTB_BUILD_TESTS = "OFF"

# Stable ABI (abi3): nanobind's STABLE_ABI only takes effect on Python >= 3.12 (below that it
# silently builds a normal per-version extension), so the abi3 tag is set only for 3.12+. That
# gives one cp312-abi3 wheel that covers 3.12 and every newer interpreter; 3.9-3.11 get a
# regular wheel each.
[[tool.scikit-build.overrides]]
if.python-version = ">=3.12"
wheel.py-api = "cp312"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/stb.h"
regex = '''(?sx)
\#define \s+ LIBSTB_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ LIBSTB_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ LIBSTB_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"

[tool.cibuildwheel]
test-command = "pytest {project}/tests/python"
test-extras = ["test"]
# numpy has no Windows arm64 wheel for 3.9 and 3.10, so the "test" extra leaves it out there (see
# [project.optional-dependencies]); the test modules that need it skip themselves
# (pytest.importorskip) and the rest, such as test_no_numpy.py, still run on those wheels.

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests/python"]
